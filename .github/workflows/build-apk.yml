name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android Project
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Project
        run: |
          PROJECT=$(find extracted -name "build.gradle" -type f | head -1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Android project: $PROJECT"
          echo "android.useAndroidX=true" >> "$PROJECT/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT/gradle.properties"

      - name: Build APK
        run: |
          gradle -p "$PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hindi-English-AI-Translator
          path: "${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
